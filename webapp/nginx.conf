# Serves one network's dashboard and proxies its Hasura API on the same host,
# so HAProxy only needs one backend port per network.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  root /usr/share/nginx/html;

  # HAProxy health check: healthy when this network's Hasura is
  location = /healthz {
    proxy_pass http://hasura:8080/healthz;
    access_log off;
  }

  # GraphQL queries and live subscriptions (websocket)
  location /v1/graphql {
    proxy_pass http://hasura:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_read_timeout 1h;
  }

  # Hasura REST endpoints (see docs/producers-API-documentation.md)
  location /api/rest/ {
    proxy_pass http://hasura:8080;
    proxy_set_header Host $host;
  }

  # Vite build output: file names contain a content hash
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
